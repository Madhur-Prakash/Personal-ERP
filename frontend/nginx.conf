# =============================================================================
# Nginx config for the built frontend (inside the frontend image).
#
# Serves static assets only. API traffic is routed by the edge reverse proxy
# (see infra/nginx/), not from here — this container knows nothing about the
# backend, which keeps it independently deployable and cacheable at a CDN.
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never advertise the version — it hands an attacker a CVE list for free.
    server_tokens off;

    # ---- Compression --------------------------------------------------------
    gzip on;
    gzip_vary on;              # so caches key on Accept-Encoding
    gzip_min_length 1024;      # below this, compression costs more than it saves
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml+rss application/atom+xml image/svg+xml
        application/wasm font/woff font/woff2;

    # ---- Security headers ---------------------------------------------------
    # See security-headers.conf for why this is an include repeated per location
    # rather than relying on nginx's add_header inheritance.
    include /etc/nginx/security-headers.conf;

    # ---- Caching ------------------------------------------------------------
    # Hashed asset filenames change whenever their contents do, so they can be
    # cached forever. `immutable` additionally stops revalidation on reload.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:woff2?|ttf|otf|eot)$ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;  # fonts are CORS-checked
        access_log off;
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|webp|avif|ico)$ {
        include /etc/nginx/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    # Source maps are built for error reporting, not for the public. Blocked
    # here; CI uploads them to the error tracker instead.
    location ~* \.map$ {
        return 404;
    }

    # ---- Health -------------------------------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- SPA fallback -------------------------------------------------------
    # index.html must never be cached: it carries the hashed asset references,
    # so a stale copy pins users to a previous deploy's (now deleted) bundles.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires 0;
    }

    # Any unmatched path returns index.html so client-side routing works on a
    # deep link or refresh — without this, /members is a 404 from Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
