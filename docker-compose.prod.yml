# =============================================================================
# Personal ERP - production stack for a self-hosted VPS
#
#   cp .env.example .env      # then fill in real secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from the development stack that matter:
#
#   * PostgreSQL and Redis are NOT published to the host. They are reachable only
#     on the internal Docker network, so the database is not exposed to the
#     internet by a misconfigured firewall.
#   * Only the edge proxy binds host ports (80/443).
#   * Migrations run as a one-shot job that the API waits on, so two replicas can
#     never race to apply the same migration.
#   * Every service has resource limits, log rotation, and a restart policy.
#   * Every service drops all Linux capabilities and forbids privilege escalation.
# =============================================================================

name: personalerp-prod

# Applied to every container. Both are one line each and both remove a whole class of
# escalation:
#
#   * `no-new-privileges` makes setuid binaries inside the image unable to gain
#     privileges. A compromised process then cannot use a stray setuid helper - `su`,
#     `mount`, a package manager's helper - to become root, which is the usual first
#     step from "code execution in a container" to "root in a container".
#   * `cap_drop: [ALL]` removes the ~14 capabilities Docker grants by default. None of
#     these services needs any of them: they bind ports above 1024 (or, for nginx, are
#     given back the one capability that requires), write to volumes they own, and make
#     outbound connections. CAP_NET_RAW alone, granted by default, permits ARP spoofing
#     against every other container on the bridge.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-logging: &default-logging
  # Without this, container logs grow without bound and eventually fill the disk
  # - the most common way a small VPS dies.
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  # ---------------------------------------------------------------------------
  # Data
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    restart: always
    <<: *hardening
    # Postgres needs two of the dropped capabilities back: it starts as root to fix
    # ownership on the data directory, then drops to the `postgres` user itself.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C --data-checksums'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/backups:/backups
    # Deliberately no `ports:` - internal network only.
    command:
      # Modest tuning for a small VPS. Raise shared_buffers to ~25% of RAM.
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      # Log slow queries so a performance regression is visible before users
      # report it.
      - -c
      - log_min_duration_statement=500
      - -c
      - log_checkpoints=on
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: '2', memory: 2G }
    logging: *default-logging
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: always
    <<: *hardening
    cap_add: [SETGID, SETUID]
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: '1', memory: 768M }
    logging: *default-logging
    networks: [internal]

  # ---------------------------------------------------------------------------
  # Migrations - one-shot, runs to completion before the API starts
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: ./backend
      target: production
    restart: 'no'
    <<: *hardening
    read_only: true
    tmpfs: [/tmp]
    env_file: [.env]
    environment:
      ENVIRONMENT: production
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    command: ['alembic', 'upgrade', 'head']
    depends_on:
      postgres: { condition: service_healthy }
    logging: *default-logging
    networks: [internal]

  # ---------------------------------------------------------------------------
  # Application
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      target: production
    restart: always
    <<: *hardening
    # The image ships only code and a virtualenv, and the process writes to exactly two
    # places: the log volume and a temporary directory. A read-only root filesystem means
    # code execution in this container cannot drop a payload on disk to survive a
    # restart, or overwrite the application's own modules.
    read_only: true
    tmpfs: [/tmp]
    env_file: [.env]
    environment:
      ENVIRONMENT: production
      DEBUG: 'false'
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      LOG_JSON: 'true' # structured output for the aggregator
      # Overrides whatever `.env` carries. That file is edited on a workstation, where
      # this setting has to name a Windows install path for OCR to work at all, and
      # `env_file` beats the image's own ENV - so the deployed container would inherit a
      # path it cannot execute and report OCR as unavailable.
      TESSERACT_CMD: /usr/bin/tesseract
    # Longer than uvicorn's own 25s graceful timeout (see the Dockerfile), so a replica
    # being replaced always exits by finishing its requests rather than by SIGKILL.
    stop_grace_period: 30s
    volumes:
      - ./logs:/app/logs
      # No documents volume, and none needed. Uploaded files are compressed into
      # PostgreSQL (`document_blob`), so they are on the postgres-data volume and inside
      # the same `pg_dump` as the ledger entries they support.
      #
      # That is what removed the last reason for this container to write to disk at all,
      # which is why `read_only: true` above is viable. It also closed a real durability
      # hole: the previous filesystem backend wrote into the container's own layer, so a
      # redeploy discarded the scans supporting posted bills.
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      # Waits for the migration job to exit 0. This is what makes replicas safe.
      migrate: { condition: service_completed_successfully }
    deploy:
      # Scale horizontally: every instance is stateless, so replicas need no
      # coordination. Nginx load-balances across them by service name.
      replicas: 2
      resources:
        limits: { cpus: '2', memory: 1G }
      update_config:
        # Start the replacement and confirm it is healthy before stopping the
        # old one - this is what makes a deploy zero-downtime.
        order: start-first
        failure_action: rollback
        delay: 10s
    logging: *default-logging
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        # Baked into the bundle at build time. Must be the public origin.
        VITE_API_BASE_URL: ${PUBLIC_API_URL:-https://app.example.com}
        VITE_API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
        VITE_APP_NAME: ${APP_NAME:-Personal ERP}
    restart: always
    <<: *hardening
    read_only: true
    # nginx writes its pid and its proxy/fastcgi scratch buffers; both must exist even
    # for a container that only serves static files.
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    deploy:
      replicas: 2
      resources:
        limits: { cpus: '0.5', memory: 256M }
      update_config:
        order: start-first
    logging: *default-logging
    networks: [internal]

  # ---------------------------------------------------------------------------
  # Edge
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: always
    <<: *hardening
    # The edge runs as root to bind 80/443, so it is given back exactly the four
    # capabilities that requires and nothing else. NET_BIND_SERVICE is the privileged-port
    # bind; the SETUID/SETGID/CHOWN trio is nginx's master process dropping to the
    # unprivileged `nginx` user for its workers - which is what makes a worker
    # compromise a compromise of a nobody account.
    cap_add: [NET_BIND_SERVICE, SETGID, SETUID, CHOWN]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    # The only service exposed to the host.
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      # Included by every proxying location in conf.d/app.conf. Mounted at the root of
      # /etc/nginx rather than inside conf.d/, because nginx loads `conf.d/*.conf` as
      # top-level configuration - a partial file of `proxy_set_header` directives placed
      # there is parsed as a server-block-less config and fails to start.
      - ./infra/nginx/proxy-params.conf:/etc/nginx/proxy-params.conf:ro
      - ./infra/certbot/conf:/etc/letsencrypt:ro
      - ./infra/certbot/www:/var/www/certbot:ro
    depends_on: [backend, frontend]
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost/healthz']
      interval: 30s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits: { cpus: '1', memory: 256M }
    logging: *default-logging
    networks: [internal]

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    <<: *hardening
    volumes:
      - ./infra/certbot/conf:/etc/letsencrypt
      - ./infra/certbot/www:/var/www/certbot
    # Wakes twice daily; certbot renews only inside the 30-day window, so this
    # is cheap and means a renewal is never missed.
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done"
    logging: *default-logging
    networks: [internal]

volumes:
  # Uploaded documents live in here too, inside PostgreSQL - see the `backend` service.
  # One volume to back up, and one dump that is internally consistent.
  postgres-data:
  redis-data:

networks:
  internal:
    driver: bridge
