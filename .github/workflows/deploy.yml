# =============================================================================
# Deploy — publishes images and rolls them out to the VPS.
#
# Triggered by a version tag, or manually. Not on every push to main: a deploy
# should be a deliberate act with an identifiable version, not a side effect of
# merging.
#
# Required repository secrets:
#   VPS_HOST, VPS_USER, VPS_SSH_KEY   SSH access to the server
#   VPS_APP_PATH                      where the repo is checked out on the server
# =============================================================================

name: Deploy

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  # Never two deploys at once — a partial rollout racing another is how a stack
  # ends up in a state nobody can reason about.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          [ "$VERSION" = "$GITHUB_REF" ] && VERSION="manual-${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Deploying $VERSION"

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: production
          push: true
          # Tagged with both the version and the commit SHA. The SHA tag is what
          # makes a precise rollback possible when a version tag was reused.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: production
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.PUBLIC_API_URL }}
            VITE_API_V1_PREFIX=/api/v1
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: Roll out to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    environment: ${{ inputs.environment || 'production' }}

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # `set -euo pipefail` so any failed step aborts the deploy instead of
          # carrying on and leaving a half-applied rollout.
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_PATH }}"

            echo "==> Backing up the database before migrating"
            # Taken before anything changes, so a failed migration is recoverable.
            ./infra/scripts/backup.sh

            echo "==> Fetching source"
            git fetch --all --tags
            git checkout --force "${GITHUB_REF#refs/tags/}" 2>/dev/null || git pull --ff-only

            echo "==> Pulling images"
            docker compose -f docker-compose.prod.yml pull

            echo "==> Applying migrations"
            # A separate step from the app rollout: if a migration fails, the
            # currently-running version keeps serving traffic untouched.
            docker compose -f docker-compose.prod.yml run --rm migrate

            echo "==> Rolling out (start-first, zero downtime)"
            docker compose -f docker-compose.prod.yml up -d --no-deps --build backend frontend
            docker compose -f docker-compose.prod.yml up -d nginx

            echo "==> Waiting for readiness"
            for attempt in $(seq 1 30); do
              if curl -fsS http://localhost/health/ready >/dev/null 2>&1; then
                echo "Ready after ${attempt} attempt(s)"
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "Readiness check failed — dumping logs and aborting"
                docker compose -f docker-compose.prod.yml logs --tail=80 backend
                exit 1
              fi
              sleep 2
            done

            echo "==> Pruning old images"
            docker image prune -f --filter "until=168h"

            echo "==> Deploy complete"
            docker compose -f docker-compose.prod.yml ps
