# =============================================================================
# Personal ERP — development stack
#
#   make up          start everything
#   make logs        tail all services
#   make migrate     apply database migrations
#
# Source is bind-mounted and both servers hot-reload.
# =============================================================================

name: personalerp

services:
  postgres:
    image: postgres:17-alpine
    container_name: personalerp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-personalerp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-personalerp}
      POSTGRES_DB: ${POSTGRES_DB:-personalerp}
      # Deterministic collation so index ordering matches across machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-personalerp} -d ${POSTGRES_DB:-personalerp}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [personalerp]

  redis:
    image: redis:7-alpine
    container_name: personalerp-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [personalerp]

  # Catches every outbound email in dev. UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: personalerp-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks: [personalerp]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: personalerp-backend
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_TLS: "false"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      # Keep the image's virtualenv; don't let the bind mount shadow it.
      - backend-venv:/app/.venv
      - ./logs:/app/logs
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [personalerp]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: personalerp-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_API_V1_PREFIX: ${VITE_API_V1_PREFIX:-/api/v1}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on: [backend]
    networks: [personalerp]

volumes:
  postgres-data:
  redis-data:
  backend-venv:
  frontend-node-modules:

networks:
  personalerp:
    driver: bridge
